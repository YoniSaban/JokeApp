<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיחה בלחיצה</title>
  <meta name="description" content="כותבים נושא, לוחצים, ומקבלים בדיחה בעברית.">
  <meta name="theme-color" content="#FFE15A">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun: #FFE15A;
      --paper: #FFFFFF;
      --ink: #2B1E4A;
      --ink-soft: #4A3D6B;
      --red: #F23D2F;
      --blue: #2E9BFF;
      --purple: #8B5CF6;
      --error: #C0261B;
      --error-bg: #FFE8EC;
      --hint: #756B92;
      --ui-font: "Fredoka", system-ui, sans-serif;
      --joke-font: "Playpen Sans Hebrew", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--sun);
      background-image: url("assets/bg-doodles.svg"), url("assets/bg-dots.svg");
      background-repeat: no-repeat, repeat;
      background-position: top center, 0 0;
      background-size: 440px auto, 16px 16px;
      color: var(--ink);
      font-family: var(--ui-font);
      font-weight: 500;
    }

    .app {
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .logo {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
      margin: 8px auto 0;
    }

    .intro {
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 500;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 18px;
      font-weight: 600;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 19px;
      font-weight: 500;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 4px 4px 0 var(--ink);
      transform: rotate(0.6deg);
      outline: none;
    }

    input::placeholder { color: var(--hint); opacity: 1; }

    input:focus-visible {
      box-shadow: 4px 4px 0 var(--ink), 0 0 0 4px var(--blue);
    }

    .go {
      width: 100%;
      min-height: 64px;
      font: inherit;
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink);
      transform: rotate(-1deg);
      cursor: pointer;
      margin-bottom: 8px;
      transition: transform 80ms ease, box-shadow 80ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .go:focus-visible {
      outline: none;
      box-shadow: 0 8px 0 var(--ink), 0 0 0 4px var(--blue);
    }

    .go:active,
    .go[aria-busy="true"] {
      transform: rotate(-1deg) translateY(6px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .go:disabled { cursor: wait; }

    .bubble {
      position: relative;
      min-height: 190px;
      margin-top: 10px;
      padding: 22px 20px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-1.2deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }

    .mascot {
      width: 118px;
      height: auto;
      display: block;
    }

    .message {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    /* מצב בדיחה: הדמות בפינה הימנית העליונה, חצי בחוץ */
    .bubble[data-state="joke"] {
      align-items: stretch;
      padding-top: 34px;
    }

    .bubble[data-state="joke"] .mascot {
      position: absolute;
      top: -40px;
      right: -14px;
      width: 86px;
      transform: rotate(8deg);
    }

    .bubble[data-state="joke"] .message {
      font-family: var(--joke-font);
      font-size: 25px;
      line-height: 1.55;
      color: var(--ink);
      text-align: right;
    }

    .bubble[data-state="error"] { background: var(--error-bg); }

    .bubble[data-state="error"] .message {
      color: var(--error);
      font-weight: 600;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }

    .actions:not(:has(> :not([hidden]))) { display: none; }

    .laugh {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 8px 22px;
      font: inherit;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      background: var(--sun);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 5px 0 var(--ink);
      transform: rotate(-1deg);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .laugh[hidden] { display: none; }

    .laugh-count {
      min-width: 30px;
      padding: 0 8px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 17px;
    }

    .laugh:focus-visible {
      outline: none;
      box-shadow: 0 5px 0 var(--ink), 0 0 0 4px var(--blue);
    }

    .laugh:active:not(:disabled) {
      transform: rotate(-1deg) translateY(4px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .laugh:disabled {
      cursor: default;
      background: var(--paper);
      transform: rotate(-1deg) translateY(4px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .top {
      margin-top: 8px;
      padding: 18px 18px 8px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 24px;
      box-shadow: 5px 5px 0 var(--ink);
      transform: rotate(0.6deg);
    }

    .top[hidden] { display: none; }

    .top h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
    }

    .top ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .top li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-top: 2px dashed var(--hint);
    }

    .top li:first-child { border-top: none; }

    .top-text {
      flex: 1;
      font-family: var(--joke-font);
      font-size: 17px;
      line-height: 1.5;
    }

    .top-count {
      flex-shrink: 0;
      padding: 2px 10px;
      background: var(--sun);
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
    }

    .share {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 8px 28px;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      background: #25D366;
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 5px 0 var(--ink);
      transform: rotate(1deg);
      -webkit-tap-highlight-color: transparent;
    }

    .share[hidden] { display: none; }

    .share:focus-visible {
      outline: none;
      box-shadow: 0 5px 0 var(--ink), 0 0 0 4px var(--blue);
    }

    .share:active {
      transform: rotate(1deg) translateY(4px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* כפתור החשבון: מדבקה לבנה בפינה העליונה בצד שמאל */
    .topbar {
      display: flex;
      justify-content: flex-end;
      min-height: 48px;
      margin-bottom: -6px;
    }

    .account {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      max-width: 220px;
      padding: 6px 16px 6px 8px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 4px 4px 0 var(--ink);
      transform: rotate(-2deg);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .account[data-guest="true"] { padding: 6px 20px; }

    .account:focus-visible {
      outline: none;
      box-shadow: 4px 4px 0 var(--ink), 0 0 0 4px var(--blue);
    }

    .account:active { transform: rotate(-2deg) translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

    .avatar {
      flex-shrink: 0;
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: #FFFFFF;
      background: var(--purple);
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      font-size: 16px;
      line-height: 1;
    }

    .avatar[hidden] { display: none; }

    .account-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .author {
      margin: 0;
      font-size: 15px;
      color: var(--ink-soft);
      text-align: right;
    }

    .author[hidden] { display: none; }

    /* חלונות: עולים מלמטה בטלפון, באמצע במחשב */
    dialog {
      width: 100%;
      max-width: 440px;
      margin: auto auto 0;
      padding: 22px 20px 26px;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-bottom: none;
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -6px 0 var(--ink);
      font-family: var(--ui-font);
    }

    dialog::backdrop { background: rgba(43, 30, 74, 0.55); }

    @media (min-width: 600px) {
      dialog {
        margin: auto;
        border-bottom: 3px solid var(--ink);
        border-radius: 26px;
        box-shadow: 6px 6px 0 var(--ink);
      }
    }

    dialog h2 {
      margin: 0 0 14px;
      font-size: 24px;
      font-weight: 700;
    }

    .close {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 40px;
      height: 40px;
      font: inherit;
      font-size: 22px;
      line-height: 1;
      color: var(--ink);
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      cursor: pointer;
    }

    .close:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--blue); }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 16px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 999px;
    }

    .tab {
      flex: 1;
      min-height: 44px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      background: transparent;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    .tab[aria-selected="true"] { color: #FFFFFF; background: var(--ink); }

    .tab:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--blue); }

    .auth-form { gap: 12px; }

    .auth-form input { transform: none; font-size: 18px; padding: 10px 14px; }

    .auth-form label { font-size: 16px; }

    .notice {
      margin: 0 0 12px;
      padding: 10px 14px;
      font-size: 16px;
      background: var(--sun);
      border: 2.5px solid var(--ink);
      border-radius: 16px;
    }

    .form-error {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--error);
    }

    .notice[hidden], .form-error[hidden], .field[hidden] { display: none; }

    .primary, .secondary, .danger {
      width: 100%;
      min-height: 54px;
      font: inherit;
      font-size: 20px;
      font-weight: 700;
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 5px 0 var(--ink);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .primary { color: #FFFFFF; background: var(--red); margin-top: 4px; }
    .secondary { color: var(--ink); background: var(--paper); }
    .danger { color: var(--error); background: var(--error-bg); }

    .primary:focus-visible, .secondary:focus-visible, .danger:focus-visible {
      outline: none;
      box-shadow: 0 5px 0 var(--ink), 0 0 0 4px var(--blue);
    }

    .primary:active:not(:disabled), .secondary:active:not(:disabled), .danger:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .primary:disabled, .secondary:disabled, .danger:disabled { cursor: wait; opacity: 0.75; }

    .me {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .me .avatar { width: 52px; height: 52px; font-size: 24px; border-width: 3px; }

    .me-name { margin: 0; font-size: 22px; font-weight: 700; }
    .me-email { margin: 0; font-size: 15px; color: var(--ink-soft); direction: ltr; text-align: right; }

    .stack { display: flex; flex-direction: column; gap: 14px; }

    .footer {
      margin-top: auto;
      padding-top: 12px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
    }

    /* תנועה */
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
    @keyframes squash { 0%, 100% { scale: 1 1; } 50% { scale: 1.06 0.86; } }
    @keyframes roll { 0%, 100% { rotate: 0deg; } 25% { rotate: -14deg; } 75% { rotate: 14deg; } }
    @keyframes wobble { 0%, 100% { rotate: 0deg; } 25% { rotate: -10deg; } 75% { rotate: 10deg; } }

    .bubble[data-state="idle"] .mascot { animation: bob 2.4s ease-in-out infinite; }
    .bubble[data-state="think"] .mascot { animation: squash 0.5s ease-in-out infinite; transform-origin: 50% 100%; }
    .bubble[data-state="joke"] .mascot { animation: roll 0.45s ease-in-out 4; }
    .bubble[data-state="error"] .mascot { animation: wobble 0.5s ease-in-out 2; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <button class="account" id="account" type="button" data-guest="true" aria-haspopup="dialog">
        <span class="avatar" id="account-avatar" aria-hidden="true" hidden></span>
        <span class="account-name" id="account-name">כניסה</span>
      </button>
    </div>

    <img class="logo" src="assets/logo.svg" width="300" height="158" alt="בדיחה בלחיצה">

    <p class="intro">כותבים נושא, לוחצים, וצוחקים.<br>בלי נושא, מקבלים בדיחה כללית.</p>

    <form id="joke-form" novalidate>
      <div class="field">
        <label for="topic">על מה הבדיחה?</label>
        <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off" enterkeyhint="go">
      </div>
      <button class="go" id="go" type="submit">תנו לי בדיחה!</button>
    </form>

    <section class="bubble" id="bubble" data-state="idle">
      <img class="mascot" id="mascot" src="assets/mascot-idle.svg" width="118" height="110" alt="">
      <p class="message" id="message" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
      <p class="author" id="author" hidden></p>
    </section>

    <div class="actions">
      <button class="laugh" id="laugh" type="button" hidden>צחקתי <span class="laugh-count" id="laugh-count">0</span></button>
      <a class="share" id="share" href="#" target="_blank" rel="noopener" hidden>שתפו</a>
    </div>

    <section class="top" id="top" hidden>
      <h2>הכי מצחיקות</h2>
      <ol id="top-list"></ol>
    </section>

    <footer class="footer">מיישם AI ואוטומציה · 53500</footer>
  </main>

  <dialog id="login-dialog" aria-labelledby="login-title">
    <button class="close" type="button" data-close aria-label="סגירה">×</button>
    <h2 id="login-title">כניסה</h2>
    <p class="notice" id="login-notice" hidden></p>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-signin" type="button" role="tab" aria-selected="true">כניסה</button>
      <button class="tab" id="tab-signup" type="button" role="tab" aria-selected="false">הרשמה</button>
    </div>
    <form class="auth-form" id="auth-form" novalidate>
      <div class="field" id="name-field" hidden>
        <label for="auth-name">איך לקרוא לך?</label>
        <input id="auth-name" name="name" type="text" maxlength="30" autocomplete="nickname" placeholder="למשל: נועה">
      </div>
      <div class="field">
        <label for="auth-email">מייל</label>
        <input id="auth-email" name="email" type="email" dir="ltr" autocomplete="email" inputmode="email" required>
      </div>
      <div class="field">
        <label for="auth-password">סיסמה</label>
        <input id="auth-password" name="password" type="password" dir="ltr" minlength="6" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="auth-error" role="alert" hidden></p>
      <button class="primary" id="auth-submit" type="submit">כניסה</button>
    </form>
  </dialog>

  <dialog id="account-dialog" aria-labelledby="account-title">
    <button class="close" type="button" data-close aria-label="סגירה">×</button>
    <h2 id="account-title">החשבון שלי</h2>
    <div class="me">
      <span class="avatar" id="me-avatar" aria-hidden="true"></span>
      <div>
        <p class="me-name" id="me-name"></p>
        <p class="me-email" id="me-email"></p>
      </div>
    </div>
    <div class="stack">
      <button class="secondary" id="sign-out" type="button">התנתקות</button>
      <button class="danger" id="delete-account" type="button">מחיקת החשבון</button>
      <p class="form-error" id="account-error" role="alert" hidden></p>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="/auth.js"></script>
  <script>
    const form = document.getElementById("joke-form");
    const input = document.getElementById("topic");
    const button = document.getElementById("go");
    const bubble = document.getElementById("bubble");
    const mascot = document.getElementById("mascot");
    const message = document.getElementById("message");
    const share = document.getElementById("share");
    const laugh = document.getElementById("laugh");
    const laughCount = document.getElementById("laugh-count");
    const topBox = document.getElementById("top");
    const topList = document.getElementById("top-list");

    const author = document.getElementById("author");

    const LAUGHED_KEY = "laughed";
    let currentId = null;

    // ---- כניסה ----
    const Auth = window.Auth;
    const accountButton = document.getElementById("account");
    const accountAvatar = document.getElementById("account-avatar");
    const accountName = document.getElementById("account-name");
    const loginDialog = document.getElementById("login-dialog");
    const loginTitle = document.getElementById("login-title");
    const loginNotice = document.getElementById("login-notice");
    const tabSignIn = document.getElementById("tab-signin");
    const tabSignUp = document.getElementById("tab-signup");
    const authForm = document.getElementById("auth-form");
    const nameField = document.getElementById("name-field");
    const authName = document.getElementById("auth-name");
    const authEmail = document.getElementById("auth-email");
    const authPassword = document.getElementById("auth-password");
    const authError = document.getElementById("auth-error");
    const authSubmit = document.getElementById("auth-submit");
    const accountDialog = document.getElementById("account-dialog");
    const meAvatar = document.getElementById("me-avatar");
    const meName = document.getElementById("me-name");
    const meEmail = document.getElementById("me-email");
    const signOutButton = document.getElementById("sign-out");
    const deleteButton = document.getElementById("delete-account");
    const accountError = document.getElementById("account-error");

    let mode = "signin";

    function userName(session) {
      const name = session?.user?.user_metadata?.full_name;
      return typeof name === "string" && name.trim() ? name.trim().slice(0, 30) : "";
    }

    function renderAccount(session) {
      const signedIn = Boolean(session?.user);
      const name = userName(session) || session?.user?.email || "";
      accountButton.dataset.guest = String(!signedIn);
      accountAvatar.hidden = !signedIn;
      accountAvatar.textContent = signedIn ? Array.from(name)[0] || "?" : "";
      accountName.textContent = signedIn ? name : "כניסה";
      accountButton.setAttribute("aria-label", signedIn ? `החשבון שלי: ${name}` : "כניסה");
      if (!signedIn && accountDialog.open) accountDialog.close();
    }

    function setMode(next) {
      mode = next;
      const signup = mode === "signup";
      tabSignIn.setAttribute("aria-selected", String(!signup));
      tabSignUp.setAttribute("aria-selected", String(signup));
      nameField.hidden = !signup;
      loginTitle.textContent = signup ? "הרשמה" : "כניסה";
      authSubmit.textContent = signup ? "להירשם" : "להיכנס";
      authPassword.autocomplete = signup ? "new-password" : "current-password";
      authError.hidden = true;
    }

    function openLogin(notice) {
      loginNotice.textContent = notice || "";
      loginNotice.hidden = !notice;
      authError.hidden = true;
      if (!loginDialog.open) loginDialog.showModal();
    }

    function openAccount() {
      const session = Auth?.session();
      if (!session) return openLogin();
      const name = userName(session) || session.user.email || "";
      meAvatar.textContent = Array.from(name)[0] || "?";
      meName.textContent = name;
      meEmail.textContent = session.user.email || "";
      accountError.hidden = true;
      deleteButton.disabled = false;
      signOutButton.disabled = false;
      accountDialog.showModal();
    }

    // כל קריאה ל-/api שולחת את הטוקן, אם יש. 401 עם auth_required כשנשלח טוקן: מתנתקים לבד
    async function api(path, options = {}) {
      const headers = new Headers(options.headers || {});
      const token = Auth ? await Auth.token().catch(() => null) : null;
      if (token) headers.set("Authorization", `Bearer ${token}`);
      const response = await fetch(path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (token && response.status === 401 && data.code === "auth_required") {
        await Auth.signOut();
        openLogin("צריך להתחבר שוב");
        data.error = "צריך להתחבר שוב.";
      }
      return { response, data };
    }

    accountButton.addEventListener("click", () => {
      if (Auth?.session()) openAccount();
      else openLogin();
    });

    tabSignIn.addEventListener("click", () => setMode("signin"));
    tabSignUp.addEventListener("click", () => setMode("signup"));

    // Escape סוגר לבד. גם לחיצה מחוץ לחלון, וכפתור ה-×
    for (const dialog of [loginDialog, accountDialog]) {
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog || event.target.closest("[data-close]")) dialog.close();
      });
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (authSubmit.disabled) return;
      authError.hidden = true;

      const email = authEmail.value.trim();
      const password = authPassword.value;
      const name = authName.value.trim();
      let problem = "";
      if (mode === "signup" && !name) problem = "צריך לכתוב איך לקרוא לך.";
      else if (!email || !authEmail.checkValidity()) problem = "כתובת המייל לא תקינה.";
      else if (mode === "signup" && password.length < 6) problem = "הסיסמה קצרה מדי. צריך לפחות 6 תווים.";
      else if (!password) problem = "צריך לכתוב סיסמה.";
      if (problem) {
        authError.textContent = problem;
        authError.hidden = false;
        return;
      }

      authSubmit.disabled = true;
      try {
        if (!Auth) throw new Error("הכניסה עוד לא מוגדרת.");
        if (mode === "signup") await Auth.signUp(name, email, password);
        else await Auth.signIn(email, password);
        authForm.reset();
        loginDialog.close();
      } catch (err) {
        authError.textContent = err?.message || "משהו השתבש בכניסה. נסו שוב.";
        authError.hidden = false;
      } finally {
        authSubmit.disabled = false;
      }
    });

    signOutButton.addEventListener("click", async () => {
      signOutButton.disabled = true;
      await Auth?.signOut();
      accountDialog.close();
    });

    deleteButton.addEventListener("click", async () => {
      if (!confirm("למחוק את החשבון? אי אפשר לבטל את זה. הבדיחות שכתבת יישארו, בלי השם שלך.")) return;
      deleteButton.disabled = true;
      accountError.hidden = true;
      try {
        const { response, data } = await api("/api/delete-account", { method: "POST" });
        if (response.ok && data.deleted) {
          await Auth.signOut();
          accountDialog.close();
          return;
        }
        accountError.textContent = data.error || "לא הצלחתי למחוק את החשבון. נסו שוב.";
      } catch {
        accountError.textContent = "אין חיבור לשרת כרגע. נסו שוב.";
      }
      accountError.hidden = false;
      deleteButton.disabled = false;
    });

    setMode("signin");
    if (Auth) {
      Auth.onChange(renderAccount);
      Auth.ready.then(() => renderAccount(Auth.session()));
    }

    // ה-id של בדיחות שכבר צחקו עליהן, כדי שרענון לא יפתח את הכפתור מחדש
    function readLaughed() {
      try {
        const ids = JSON.parse(localStorage.getItem(LAUGHED_KEY) || "[]");
        return Array.isArray(ids) ? ids : [];
      } catch {
        return [];
      }
    }

    function markLaughed(id) {
      try {
        const ids = readLaughed().filter((x) => x !== id);
        ids.push(id);
        localStorage.setItem(LAUGHED_KEY, JSON.stringify(ids.slice(-200)));
      } catch {}
    }

    function showLaugh(id, count) {
      currentId = id;
      laugh.hidden = !id;
      if (!id) return;
      laughCount.textContent = String(count);
      laugh.disabled = readLaughed().includes(id);
    }

    const BUTTON_TEXT = {
      idle: "תנו לי בדיחה!",
      think: "חושב...",
      joke: "עוד בדיחה!",
      error: "לנסות שוב",
    };

    function setState(state, text) {
      bubble.dataset.state = state;
      mascot.src = `assets/mascot-${state}.svg`;
      message.textContent = text;
      button.textContent = BUTTON_TEXT[state];
      const busy = state === "think";
      button.disabled = busy;
      button.setAttribute("aria-busy", String(busy));

      author.hidden = true;
      share.hidden = state !== "joke";
      if (state === "joke") {
        const shareText = `${text}\n\nמתוך בדיחה בלחיצה: ${location.origin}`;
        share.href = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
      } else {
        showLaugh(null);
      }
    }

    async function loadTop() {
      try {
        const { response, data } = await api("/api/top");
        if (!response.ok || !Array.isArray(data.top)) return;
        topList.replaceChildren(
          ...data.top.map((item) => {
            const li = document.createElement("li");
            const text = document.createElement("span");
            text.className = "top-text";
            text.textContent = item.text;
            const count = document.createElement("span");
            count.className = "top-count";
            count.textContent = item.laughs === 1 ? "צחוק אחד" : `${item.laughs} צחוקים`;
            li.append(text, count);
            return li;
          })
        );
        topBox.hidden = data.top.length === 0;
      } catch {}
    }

    laugh.addEventListener("click", async () => {
      const id = currentId;
      if (!id || laugh.disabled) return;
      laugh.disabled = true;

      try {
        const { response, data } = await api("/api/laugh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        if (response.ok && typeof data.laughs === "number") {
          markLaughed(id);
          if (currentId === id) laughCount.textContent = String(data.laughs);
          loadTop();
        } else if (currentId === id) {
          laugh.disabled = false;
        }
      } catch {
        if (currentId === id) laugh.disabled = false;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;

      const topic = input.value.trim().slice(0, 100);
      setState("think", topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה...");

      try {
        const { response, data } = await api("/api/joke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic }),
        });

        if (response.ok && typeof data.joke === "string" && data.joke) {
          setState("joke", data.joke);
          showLaugh(typeof data.id === "string" ? data.id : null, 0);
          if (typeof data.author_name === "string" && data.author_name) {
            author.textContent = `נכתבה עכשיו בשבילך, ${data.author_name}`;
            author.hidden = false;
          }
        } else {
          setState("error", data.error || "משהו השתבש. נסו שוב.");
        }
      } catch {
        setState("error", "אין חיבור לשרת כרגע. נסו שוב.");
      }
    });

    loadTop();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((error) => console.error("SW", error));
      });
    }
  </script>
</body>
</html>
